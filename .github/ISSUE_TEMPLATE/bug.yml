name: Bug report
description: Report a reproducible defect in media-analysis
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not include credentials, signed URLs,
        private media, or vulnerabilities. Follow SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "1.2.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: image
    attributes:
      label: Worker image
      options:
        - analysis-cpu
        - matte-cpu reference
        - local Python
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide safe commands, a minimal request with secrets removed, and fixture details.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Python, ffmpeg, Docker, and relevant configuration names.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove signed URLs, keys, media contents, and personal data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets, signed URLs, and private media.
          required: true
        - label: This is not a security vulnerability.
          required: true
